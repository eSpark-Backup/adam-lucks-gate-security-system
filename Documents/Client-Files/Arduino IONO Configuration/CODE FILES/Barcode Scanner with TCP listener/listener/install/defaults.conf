#!/bin/bash
#
# This file will be copied by the installer to conf/listen.conf
#

## The number of seconds the relay will be triggered
## This is a STRING with exactly 2 characters like "02"
RELAY_TRIGGER_SECONDS="80"





## This function processes the received barcode string
####################################################################################
## Calling an external script or an API URL is a huge overhead!
function barcodeReceived(){

	## Sanitize: Strip non-alphanumeric chars from the first argument
	export BarCode=${1//[^[:alnum:]]/} 	

	## Get scanner integer ID
	export ScannerId=${2//[^[:digit:]]/}


	### SLOW: Call an external PHP script owned by user `listener`
	######################################################
	#ok=$(php -f "../install/barcodeReceived.php")	
	#if [ -z "$ok" -o "$?" != "0" ]; then
	#	### Invalid / not found
	#	return 1
	#fi 
	### The output should be the string "ok"
	#[ "$ok" != "ok" ] && return 1;


	### SLOWER: Request an URL
	######################################################
	#ok=$(curl -s -d "BarCode=$BarCode" http://18.217.195.71/barcodeReceived.php)
	#if [ -z "$ok" -o "$?" != "0" ]; then
	#	### Invalid / not found
	#	return 1
	#fi 
	### The output should be the string "ok"
	#[ "$ok" != "ok" ] && return 1;


	### SLOW : Request API URL
	######################################################	
	ok=$(curl --connect-timeout 2 --max-time 5 --retry 3 --retry-delay 0 --retry-max-time 10 --silent --get "https://zuul2.zuulsystems.com/api/scanned-qr-code/scanner/$ScannerId/$BarCode")
	
	### Check if there was an error
	if [ "$?" != "0" ]; then
		echo "Requesting API URL FAILED!" >> $LOGF	
		return 1 
	else 
		### Strip non-alphanumeric chars
		ok=${ok//[^[:alnum:]]/} 
		echo "Response from API URL: $ok" >> $LOGF
	fi
	
	### The output should be the string 'booltruemessageQRCodeVerified'
	[ "$ok" != 'booltruemessageQRCodeVerified' ] && return 1;
	

	### Recommended: Business logic in here
	######################################################
	#ok=$(mysql -e "SELECT id FROM database.barcodes WHERE barcode='$BarCode'");
	#if [ -z "$ok" -o "$?" != "0" ]; then
	#	### Invalid / not found
	#	return 1
	#fi 
	### The output should be an integer > 0
	#[ "$ok" -lt 1 ] && return 1;




	### Since we got here, it means the barcode is valid.
	######################################################
	desc=''
	echo "The barcode is valid! Sending response back to the scanner: Turn the relay on for $RELAY_TRIGGER_SECONDS seconds" >> $LOGF

	## "Turns the relay on for xx seconds"
	#sendCmd "!$RELAY_TRIGGER_SECONDS"

	## "Turns the speaker on for xx * 10ms"
	#sendCmd "&80"
	
	## "Blinks the bicolor led for xx seconds, then leaves it off"
	#sendCmd "($RELAY_TRIGGER_SECONDS"

	## Sends all 3 commands above at once
	sendCmd "!$RELAY_TRIGGER_SECONDS\r&80\r($RELAY_TRIGGER_SECONDS"
}




## This functions are triggered when a sensor changes it`s state
####################################################################################


#>:S1C Sense Input 1 Low	= BLACK +++ Blue
function sensorEventS1C(){

	## "Turns the speaker on for xx * 10ms"
	sendCmd "&11"
}

#>:S1O Sense Input 1 High	= BLACK < > Blue
function sensorEventS1O(){

	## "Turns the speaker on for xx * 10ms"
	sendCmd "&10"	
}


#>:S2C Sense Input 2 Low	= WHITE +++ Blue
function sensorEventS2C(){

	## "Turns the speaker on for xx * 10ms"
	sendCmd "&21"		
}

#>:S2O Sense Input 2 High	= WHITE < > Blue
function sensorEventS2O(){

	## "Turns the speaker on for xx * 10ms"
	sendCmd "&20"		
}

